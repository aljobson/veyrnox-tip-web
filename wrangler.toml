name = "veyrnox-tip-web"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# account_id is read from CLOUDFLARE_ACCOUNT_ID env var (see README).
# Do not commit it here.

[env.production]
name = "veyrnox-tip-web-prod"
routes = [
  { pattern = "tip.veyrnox.com/*", zone_name = "veyrnox.com" }
]

# Server-side secrets must be set via `wrangler pages secret put`
# (TIP_API_KEY, TIP_SIGNING_SECRET, TIP_API_ENDPOINT). Never in this file.

# Per-IP rate limit counter for /api/tip-proxy.
#
# MUST configure before first deploy — the proxy REFUSES to serve in production
# when this binding is missing (fail-closed guard in
# src/app/api/tip-proxy/[[...path]]/route.ts):
#
#   1. Create namespaces:
#        wrangler kv namespace create TIP_RATE_LIMIT
#        wrangler kv namespace create TIP_RATE_LIMIT --preview  # for `wrangler pages dev`
#   2. Uncomment the block below and paste the returned ids.
#
# Left commented so a fresh clone cannot accidentally deploy with a placeholder
# id that Wrangler will happily accept and then fail at runtime.
#
# [[kv_namespaces]]
# binding = "TIP_RATE_LIMIT"
# id = "PASTE_REAL_KV_NAMESPACE_ID_HERE"
# preview_id = "PASTE_REAL_KV_PREVIEW_ID_HERE"
